<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#090d16" />
  <title>AcademicHub - IF Goiano</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>

  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.css" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.js"></script>

  <style>
    .fc {
      --fc-border-color: #334155;
      --fc-page-bg-color: #0f172a;
      --fc-neutral-bg-color: #1e293b;
      --fc-list-event-hover-bg-color: #334155;
      color: #f8fafc;
    }
    .fc .fc-toolbar-title { font-size: 1.1rem; font-weight: 600; }
    .fc .fc-button-primary { background-color: #059669; border-color: #059669; }
    .fc .fc-button-primary:hover { background-color: #047857; border-color: #047857; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 antialiased font-sans">

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // --- CONFIGURAÇÃO DO SUPABASE ---
    const SUPABASE_URL = "https://jnkonklwmaseeylebhdt.supabase.co"; 
    const SUPABASE_KEY = "sb_publishable_lQ1jnvO5jio3YqNRNDUkuw_a33pg5s7"; 
    const SENHA_REPRESENTANTE = "info2026"; 

    const supabaseClient = (SUPABASE_KEY && !SUPABASE_KEY.includes("SUA_CHAVE")) 
      ? supabase.createClient(SUPABASE_URL, SUPABASE_KEY) 
      : null;

    function App() {
      const [eventos, setEventos] = useState([]);
      const [materiais, setMateriais] = useState([]);
      const [aba, setAba] = useState('dashboard');
      const [isEditor, setIsEditor] = useState(false);
      
      // Formulário de Atividades
      const [titulo, setTitulo] = useState('');
      const [descricao, setDescricao] = useState('');
      const [tipo, setTipo] = useState('prova');
      const [dataHora, setDataHora] = useState('');

      // Formulário de Materiais PDF
      const [nomeMaterial, setNomeMaterial] = useState('');
      const [arquivoPDF, setArquivoPDF] = useState(null);
      const [disciplina, setDisciplina] = useState('');
      const [enviando, setEnviando] = useState(false);

      const calendarRef = useRef(null);

      // Carregar eventos do Banco de Dados
      const carregarEventos = async () => {
        if (!supabaseClient) return;
        try {
          const { data, error } = await supabaseClient.from('provas').select('*');
          if (data) {
            const formatados = data.map(item => ({
              id: String(item.id),
              title: `[${item.tipo ? item.tipo.toUpperCase() : 'EVENTO'}] ${item.title}`,
              start: item.start,
              color: item.tipo === 'prova' ? '#dc2626' : 
                     item.tipo === 'dever' ? '#d97706' : 
                     item.tipo === 'evento' ? '#8b5cf6' : '#2563eb',
              tipo: item.tipo,
              nomeOriginal: item.title,
              descricao: item.descricao || 'Sem descrição cadastrada.'
            }));
            setEventos(formatados);
          }
        } catch (err) {
          console.error("Erro ao carregar dados:", err);
        }
      };

      // Carregar materiais em PDF do Banco de Dados
      const carregarMateriais = async () => {
        if (!supabaseClient) return;
        try {
          const { data, error } = await supabaseClient.from('materiais').select('*');
          if (data) {
            setMateriais(data);
          }
        } catch (err) {
          console.error("Erro ao carregar materiais:", err);
        }
      };

      useEffect(() => {
        carregarEventos();
        carregarMateriais();
      }, []);

      // Renderizar Calendário
      useEffect(() => {
        if (aba === 'calendario' && calendarRef.current) {
          const calendar = new FullCalendar.Calendar(calendarRef.current, {
            initialView: 'dayGridMonth',
            locale: 'pt-br',
            headerToolbar: { left: 'prev,next today', center: 'title', right: 'dayGridMonth,timeGridWeek' },
            events: eventos,
            height: '75vh'
          });
          calendar.render();
        }
      }, [aba, eventos]);

      // Ativar modo editor com senha
      const autenticarRepresentante = () => {
        if (isEditor) {
          setIsEditor(false);
          alert("Modo Editor desativado.");
          return;
        }
        const senhaDigitada = prompt("Digite a senha de Representante:");
        if (senhaDigitada === SENHA_REPRESENTANTE) {
          setIsEditor(true);
          alert("Acesso concedido! Agora você pode adicionar ou excluir itens.");
        } else if (senhaDigitada !== null) {
          alert("Senha incorreta!");
        }
      };

      // Criar Evento no Servidor
      const criarEvento = async (e) => {
        e.preventDefault();
        if (!titulo || !dataHora) return;

        if (!supabaseClient) {
          alert("A chave do Supabase não foi configurada!");
          return;
        }

        const { error } = await supabaseClient.from('provas').insert([
          { title: titulo, tipo: tipo, start: dataHora, descricao: descricao }
        ]);

        if (error) {
          alert("Erro ao salvar no servidor: " + error.message);
        } else {
          alert("Evento publicado para toda a turma com sucesso!");
          setTitulo('');
          setDescricao('');
          setDataHora('');
          carregarEventos();
        }
      };

      // Deletar Evento no Servidor
      const deletarEvento = async (id) => {
        if (!confirm("Tem certeza que deseja apagar este item para toda a turma?")) return;
        if (!supabaseClient) return;

        const { error } = await supabaseClient.from('provas').delete().eq('id', id);
        if (!error) {
          carregarEventos();
        } else {
          alert("Erro ao excluir item.");
        }
      };

      // Upload de PDF para o Supabase Storage
      const publicarMaterial = async (e) => {
        e.preventDefault();
        if (!nomeMaterial || !arquivoPDF) {
          alert("Por favor, selecione um arquivo e preencha o nome do material.");
          return;
        }

        if (!supabaseClient) return;

        try {
          setEnviando(true);

          const extensao = arquivoPDF.name.split('.').pop();
          const nomeArquivoUnico = `${Date.now()}_${Math.random().toString(36).substring(7)}.${extensao}`;

          const { data: storageData, error: storageError } = await supabaseClient
            .storage
            .from('MATERIAIS_PDF')
            .upload(nomeArquivoUnico, arquivoPDF);

          if (storageError) throw storageError;

          const { data: publicUrlData } = supabaseClient
            .storage
            .from('MATERIAIS_PDF')
            .getPublicUrl(nomeArquivoUnico);

          const publicUrl = publicUrlData.publicUrl;

          const { error: dbError } = await supabaseClient.from('materiais').insert([
            { nome: nomeMaterial, url: publicUrl, disciplina: disciplina || 'Geral' }
          ]);

          if (dbError) throw dbError;

          alert("PDF enviado e anexado com sucesso!");
          setNomeMaterial('');
          setDisciplina('');
          setArquivoPDF(null);
          carregarMateriais();

        } catch (error) {
          alert("Erro ao enviar o arquivo: " + error.message);
        } finally {
          setEnviando(false);
        }
      };

      // Deletar PDF
      const deletarMaterial = async (id) => {
        if (!confirm("Tem certeza que deseja excluir este arquivo?")) return;
        if (!supabaseClient) return;

        const { error } = await supabaseClient.from('materiais').delete().eq('id', id);
        if (!error) {
          carregarMateriais();
        } else {
          alert("Erro ao excluir arquivo.");
        }
      };

      return (
        <div className="flex flex-col md:flex-row h-screen bg-slate-950 text-slate-100 font-sans">
          
          {/* Sidebar Lateral */}
          <aside className="w-full md:w-64 bg-slate-900 border-b md:border-b-0 md:border-r border-slate-800 p-6 flex flex-col justify-between">
            <div>
              <div className="flex items-center gap-3 mb-8">
                <div className="w-10 h-10 rounded-xl bg-emerald-600 flex items-center justify-center font-bold text-xl text-white shadow-lg shadow-emerald-900/40">
                  IF
                </div>
                <div>
                  <h1 className="font-bold text-lg tracking-wide text-white">AcademicHub</h1>
                  <span className="text-xs text-slate-400">2º Téc. Informática</span>
                </div>
              </div>

              <nav className="space-y-2">
                <button 
                  onClick={() => setAba('dashboard')}
                  className={`w-full text-left px-4 py-3 rounded-xl font-medium flex items-center gap-3 transition ${
                    aba === 'dashboard' ? 'bg-emerald-600/10 text-emerald-400 border border-emerald-500/20' : 'text-slate-400 hover:bg-slate-800'
                  }`}>
                  📖 Painel Principal
                </button>

                <button 
                  onClick={() => setAba('grade')}
                  className={`w-full text-left px-4 py-3 rounded-xl font-medium flex items-center gap-3 transition ${
                    aba === 'grade' ? 'bg-emerald-600/10 text-emerald-400 border border-emerald-500/20' : 'text-slate-400 hover:bg-slate-800'
                  }`}>
                  📊 Grade Horária
                </button>

                <button 
                  onClick={() => setAba('materiais')}
                  className={`w-full text-left px-4 py-3 rounded-xl font-medium flex items-center gap-3 transition ${
                    aba === 'materiais' ? 'bg-emerald-600/10 text-emerald-400 border border-emerald-500/20' : 'text-slate-400 hover:bg-slate-800'
                  }`}>
                  📄 Materiais & PDFs
                </button>
                
                <button 
                  onClick={() => setAba('calendario')}
                  className={`w-full text-left px-4 py-3 rounded-xl font-medium flex items-center gap-3 transition ${
                    aba === 'calendario' ? 'bg-emerald-600/10 text-emerald-400 border border-emerald-500/20' : 'text-slate-400 hover:bg-slate-800'
                  }`}>
                  📅 Calendário
                </button>
              </nav>
            </div>

            {/* Botão de Acesso do Representante */}
            <div className="mt-6 md:mt-0 space-y-3">
              <button 
                onClick={autenticarRepresentante}
                className={`w-full text-xs font-semibold py-2.5 px-3 rounded-xl flex items-center justify-center gap-2 transition ${
                  isEditor 
                    ? 'bg-amber-500/20 text-amber-400 border border-amber-500/30 hover:bg-amber-500/30' 
                    : 'bg-slate-800 text-slate-400 border border-slate-700 hover:bg-slate-700'
                }`}>
                {isEditor ? "🔓 Modo Editor (Ativo)" : "🔒 Acesso Representante"}
              </button>

              <div className="p-3 rounded-xl bg-slate-800/40 border border-slate-700/40 text-xs text-slate-400 text-center">
                {isEditor ? "Permissão para alterar liberada" : "Visão de Aluno (Apenas Leitura)"}
              </div>
            </div>
          </aside>

          {/* Conteúdo Principal */}
          <main className="flex-1 p-4 md:p-8 overflow-y-auto">
            
            {/* ABA: DASHBOARD */}
            {aba === 'dashboard' && (
              <div className="max-w-5xl mx-auto space-y-8">
                <header>
                  <h2 className="text-2xl font-bold text-white">Mural de Atividades da Turma</h2>
                  <p className="text-slate-400 text-sm">Provas e trabalhos mantidos pelos representantes do 2º Téc. Informática.</p>
                </header>

                <div className="grid grid-cols-1 lg:grid-cols-3 gap-8">
                  
                  {/* Formulário (Só para Representantes) */}
                  {isEditor ? (
                    <div className="bg-slate-900 border border-amber-500/30 rounded-2xl p-6 shadow-xl relative">
                      <div className="absolute -top-3 right-4 bg-amber-500 text-slate-950 font-bold text-[10px] uppercase px-2 py-0.5 rounded-md">
                        Painel Representante
                      </div>
                      <h3 className="text-lg font-semibold mb-4 flex items-center gap-2 text-white">
                        ➕ Publicar para a Turma
                      </h3>
                      <form onSubmit={criarEvento} className="space-y-4">
                        <div>
                          <label className="text-xs font-medium text-slate-400 block mb-1">Título</label>
                          <input 
                            type="text" 
                            placeholder="Ex: Prova de POO - Renato" 
                            value={titulo}
                            onChange={(e) => setTitulo(e.target.value)}
                            className="w-full bg-slate-800 border border-slate-700 rounded-xl p-3 text-sm text-white focus:outline-none focus:border-emerald-500"
                          />
                        </div>

                        <div>
                          <label className="text-xs font-medium text-slate-400 block mb-1">Descrição / Instruções</label>
                          <textarea 
                            rows="3"
                            placeholder="Ex: Estudar os capítulos 3 e 4. Trazer calculadora..." 
                            value={descricao}
                            onChange={(e) => setDescricao(e.target.value)}
                            className="w-full bg-slate-800 border border-slate-700 rounded-xl p-3 text-sm text-white focus:outline-none focus:border-emerald-500 resize-none"
                          />
                        </div>

                        <div>
                          <label className="text-xs font-medium text-slate-400 block mb-1">Categoria</label>
                          <select 
                            value={tipo}
                            onChange={(e) => setTipo(e.target.value)}
                            className="w-full bg-slate-800 border border-slate-700 rounded-xl p-3 text-sm text-white focus:outline-none focus:border-emerald-500">
                            <option value="prova">Prova</option>
                            <option value="dever">Entrega de Trabalho</option>
                            <option value="evento">Evento</option>
                            <option value="estudo">Aviso Importante</option>
                          </select>
                        </div>

                        <div>
                          <label className="text-xs font-medium text-slate-400 block mb-1">Data e Horário</label>
                          <input 
                            type="datetime-local" 
                            value={dataHora}
                            onChange={(e) => setDataHora(e.target.value)}
                            className="w-full bg-slate-800 border border-slate-700 rounded-xl p-3 text-sm text-white focus:outline-none focus:border-emerald-500"
                          />
                        </div>

                        <button 
                          type="submit"
                          className="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-medium p-3 rounded-xl shadow-lg shadow-emerald-900/30 transition">
                          Publicar para Todos
                        </button>
                      </form>
                    </div>
                  ) : (
                    <div className="bg-slate-900/60 border border-slate-800 rounded-2xl p-6 flex flex-col items-center justify-center text-center">
                      <div className="w-12 h-12 rounded-full bg-slate-800 flex items-center justify-center text-slate-400 mb-3 text-xl">
                        🛡️
                      </div>
                      <h3 className="font-semibold text-slate-200 mb-1">Apenas Leitura</h3>
                      <p className="text-xs text-slate-400 leading-relaxed">
                        Apenas os representantes de turma cadastram novas avaliações e datas de entregas neste mural.
                      </p>
                    </div>
                  )}

                  {/* Lista de Atividades */}
                  <div className="lg:col-span-2 bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-xl">
                    <h3 className="text-lg font-semibold mb-4 flex items-center gap-2 text-white">
                      ⏰ Próximas Avaliações & Trabalhos
                    </h3>

                    {eventos.length === 0 ? (
                      <p className="text-slate-500 text-sm py-8 text-center">Nenhum evento registrado no momento.</p>
                    ) : (
                      <div className="space-y-4 max-h-[480px] overflow-y-auto pr-2">
                        {eventos.map((item) => (
                          <div key={item.id} className="p-4 rounded-xl bg-slate-800/50 border border-slate-700/50 hover:border-slate-600 transition space-y-2">
                            <div className="flex justify-between items-start">
                              <div>
                                <h4 className="font-semibold text-slate-200">{item.nomeOriginal || item.title}</h4>
                                <span className="text-xs text-slate-400 block mt-0.5">
                                  📅 Data: {new Date(item.start).toLocaleString('pt-BR')}
                                </span>
                              </div>
                              <div className="flex items-center gap-3">
                                <span className={`text-xs px-2.5 py-1 rounded-full font-semibold ${
                                  item.tipo === 'prova' ? 'bg-red-500/10 text-red-400 border border-red-500/20' :
                                  item.tipo === 'dever' ? 'bg-amber-500/10 text-amber-400 border border-amber-500/20' :
                                  item.tipo === 'evento' ? 'bg-purple-500/10 text-purple-400 border border-purple-500/20' :
                                  'bg-blue-500/10 text-blue-400 border border-blue-500/20'
                                }`}>
                                  {(item.tipo || 'item').toUpperCase()}
                                </span>
                                
                                {isEditor && (
                                  <button 
                                    onClick={() => deletarEvento(item.id)}
                                    className="text-slate-500 hover:text-red-400 p-1 transition"
                                    title="Excluir Item">
                                    🗑️
                                  </button>
                                )}
                              </div>
                            </div>

                            {item.descricao && (
                              <div className="p-3 bg-slate-900/70 rounded-lg border border-slate-800 text-xs text-slate-300">
                                <span className="font-semibold text-slate-400 block mb-0.5">📌 O que fazer:</span>
                                {item.descricao}
                              </div>
                            )}
                          </div>
                        ))}
                      </div>
                    )}
                  </div>

                </div>
              </div>
            )}

            {/* ABA: MATERIAIS & PDFS */}
            {aba === 'materiais' && (
              <div className="max-w-5xl mx-auto space-y-8">
                <header>
                  <h2 className="text-2xl font-bold text-white">Anexos & Materiais de Estudo</h2>
                  <p className="text-slate-400 text-sm">Downloads de PDFs, apostilas e orientações de trabalhos.</p>
                </header>

                <div className="grid grid-cols-1 lg:grid-cols-3 gap-8">
                  {isEditor ? (
                    <div className="bg-slate-900 border border-amber-500/30 rounded-2xl p-6 shadow-xl relative">
                      <h3 className="text-lg font-semibold mb-4 flex items-center gap-2 text-white">
                        📎 Anexar PDF / Material
                      </h3>
                      <form onSubmit={publicarMaterial} className="space-y-4">
                        <div>
                          <label className="text-xs font-medium text-slate-400 block mb-1">Nome do Arquivo/Material</label>
                          <input 
                            type="text" 
                            placeholder="Ex: Roteiro do Trabalho de Web II" 
                            value={nomeMaterial}
                            onChange={(e) => setNomeMaterial(e.target.value)}
                            className="w-full bg-slate-800 border border-slate-700 rounded-xl p-3 text-sm text-white focus:outline-none focus:border-emerald-500"
                          />
                        </div>

                        <div>
                          <label className="text-xs font-medium text-slate-400 block mb-1">Disciplina</label>
                          <input 
                            type="text" 
                            placeholder="Ex: Desenvolvimento Web II" 
                            value={disciplina}
                            onChange={(e) => setDisciplina(e.target.value)}
                            className="w-full bg-slate-800 border border-slate-700 rounded-xl p-3 text-sm text-white focus:outline-none focus:border-emerald-500"
                          />
                        </div>

                        <div>
                          <label className="text-xs font-medium text-slate-400 block mb-1">Selecione o PDF no Computador</label>
                          <input 
                            type="file" 
                            accept=".pdf"
                            onChange={(e) => setArquivoPDF(e.target.files[0])}
                            className="w-full bg-slate-800 border border-slate-700 rounded-xl p-2.5 text-xs text-slate-300 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-emerald-600 file:text-white hover:file:bg-emerald-500 cursor-pointer"
                          />
                        </div>

                        <button 
                          type="submit"
                          disabled={enviando}
                          className={`w-full bg-emerald-600 hover:bg-emerald-500 text-white font-medium p-3 rounded-xl shadow-lg shadow-emerald-900/30 transition ${
                            enviando ? 'opacity-50 cursor-not-allowed' : ''
                          }`}>
                          {enviando ? "Enviando PDF..." : "Anexar Arquivo"}
                        </button>
                      </form>
                    </div>
                  ) : (
                    <div className="bg-slate-900/60 border border-slate-800 rounded-2xl p-6 flex flex-col items-center justify-center text-center">
                      <div className="w-12 h-12 rounded-full bg-slate-800 flex items-center justify-center text-slate-400 mb-3 text-xl">
                        📁
                      </div>
                      <h3 className="font-semibold text-slate-200 mb-1">Área de Downloads</h3>
                      <p className="text-xs text-slate-400 leading-relaxed">
                        Acesse abaixo os arquivos PDF disponibilizados para a turma.
                      </p>
                    </div>
                  )}

                  <div className="lg:col-span-2 bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-xl">
                    <h3 className="text-lg font-semibold mb-4 flex items-center gap-2 text-white">
                      📚 Arquivos Disponíveis
                    </h3>

                    {materiais.length === 0 ? (
                      <p className="text-slate-500 text-sm py-8 text-center">Nenhum PDF ou material anexado ainda.</p>
                    ) : (
                      <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                        {materiais.map((mat) => (
                          <div key={mat.id} className="p-4 bg-slate-800/60 border border-slate-700/60 rounded-xl flex flex-col justify-between space-y-3">
                            <div>
                              <span className="text-[10px] font-bold uppercase tracking-wider text-emerald-400 bg-emerald-500/10 border border-emerald-500/20 px-2 py-0.5 rounded">
                                {mat.disciplina || 'Geral'}
                              </span>
                              <h4 className="font-semibold text-white mt-2 leading-snug">{mat.nome}</h4>
                            </div>

                            <div className="flex items-center justify-between pt-2 border-t border-slate-700/50">
                              <a 
                                href={mat.url} 
                                target="_blank" 
                                rel="noreferrer" 
                                className="inline-flex items-center gap-1.5 text-xs font-semibold text-emerald-400 hover:text-emerald-300 transition">
                                📥 Abrir / Baixar PDF
                              </a>

                              {isEditor && (
                                <button 
                                  onClick={() => deletarMaterial(mat.id)}
                                  className="text-slate-500 hover:text-red-400 text-xs transition">
                                  🗑️ Excluir
                                </button>
                              )}
                            </div>
                          </div>
                        ))}
                      </div>
                    )}
                  </div>
                </div>
              </div>
            )}

            {/* ABA: GRADE HORÁRIA */}
            {aba === 'grade' && (
              <div className="max-w-6xl mx-auto space-y-6">
                <header className="flex justify-between items-center">
                  <div>
                    <h2 className="text-2xl font-bold text-white">Grade Horária Semanal</h2>
                    <p className="text-slate-400 text-sm">2º ano Téc. Informática - IF Goiano</p>
                  </div>
                  <span className="bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 text-xs px-3 py-1.5 rounded-full font-semibold">
                    INFO 2
                  </span>
                </header>

                <div className="bg-slate-900 border border-slate-800 rounded-2xl overflow-hidden shadow-2xl">
